<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zosia ❤️</title>
<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
    background:#fff5f7;
}
.box{
    text-align:center;
    background:white;
    padding:40px 25px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
    width:min(90%,420px);
    box-sizing:border-box;
}
h1{
    color:red;
    font-size:32px;
    margin-bottom:35px;
}
button{
    border:0;
    border-radius:12px;
    padding:15px 30px;
    font-size:20px;
    cursor:pointer;
    margin:10px;
    transition:all .25s ease;
}
#yes{
    background:#ff4d6d;
    color:white;
}
#no{
    background:#ddd;
    color:#222;
}
#message{
    margin-top:20px;
    font-size:18px;
    color:#ff4d6d;
    min-height:24px;
}
</style>
</head>
<body>
<div class="box">
    <h1>Zosia, kochasz mnie? ❤️</h1>
    <button id="yes">TAK ❤️</button>
    <button id="no">NIE</button>
    <div id="message"></div>
</div>

<script>
const yesButton=document.getElementById("yes");
const noButton=document.getElementById("no");
const message=document.getElementById("message");
let size=20;

yesButton.addEventListener("click",()=>{
    size-=2;
    if(size<6) size=6;

    yesButton.style.fontSize=size+"px";
    yesButton.style.padding=
        Math.max(4,size*.7)+"px "+
        Math.max(8,size*1.5)+"px";

    message.textContent="Jesteś pewna? 😏❤️";
});

noButton.addEventListener("click",()=>{
    message.textContent="Oj nie 😭 Spróbuj jeszcze raz ❤️";
});
</script>
</body>
</html>
